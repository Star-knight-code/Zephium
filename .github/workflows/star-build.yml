name: Star Browser (Windows x64)

# Builds the personal Star Browser installer. Run it from the Actions tab,
# then download the "star-browser-windows-x64" artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: star-windows
      - run: pnpm install --frozen-lockfile

      - name: Write third-party notices
        run: |
          python3 scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt \
            || python scripts/release/third_party_notices.py target/THIRD_PARTY_NOTICES.txt

      - name: Build
        timeout-minutes: 90
        working-directory: desktop
        run: >-
          pnpm tauri build --bundles nsis
          --config tauri.star.conf.json
          --config '{"bundle":{"resources":{"../target/THIRD_PARTY_NOTICES.txt":"licenses/THIRD_PARTY_NOTICES.txt"}}}'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-browser-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
